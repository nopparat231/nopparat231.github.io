<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile - Nopparat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0ff;
            --secondary-color: #2b2b2b;
            --accent-color: #f0f;
            --text-color: #fff;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --neon-shadow: 0 0 10px var(--primary-color),
                          0 0 20px var(--primary-color),
                          0 0 30px var(--primary-color);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                linear-gradient(45deg, rgba(255, 0, 255, 0.05) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(0, 255, 255, 0.05) 25%, transparent 25%);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            z-index: 1;
        }

        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            margin-bottom: 1rem;
            position: relative;
            transition: all 0.5s ease;
            box-shadow: var(--neon-shadow);
            animation: pulse 2s infinite;
        }

        .profile-img::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }

        .profile-name {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: var(--neon-shadow);
        }

        .profile-bio {
            font-size: 1.2rem;
            color: var(--text-color);
            max-width: 600px;
            margin: 0 auto;
            text-shadow: 0 0 5px var(--primary-color);
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transition: 0.5s;
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .stat-icon {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            text-shadow: var(--neon-shadow);
        }

        .followers-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .stat-number img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .social-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 15px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.1);
            animation: fadeIn 1s ease;
        }

        .social-link {
            position: relative;
            color: var(--text-color);
            font-size: 1.8rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .social-link i {
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.4);
        }

        .social-link:hover::before {
            opacity: 0.2;
        }

        .social-link:hover i {
            transform: scale(1.2);
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.4);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(0, 255, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 255, 255, 0);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cyber-line {
            position: fixed;
            width: 100%;
            height: 2px;
            background: var(--primary-color);
            animation: scan 3s linear infinite;
            opacity: 0.5;
            z-index: 0;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100vh);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            .profile-name {
                font-size: 2rem;
            }
            .profile-img {
                width: 150px;
                height: 150px;
            }
            .stats-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="cyber-line"></div>
    <div class="container">
        <header class="profile-header">
            <img src="https://avatars.githubusercontent.com/nopparat231" alt="Profile Picture" class="profile-img">
            <h1 class="profile-name">Nopparat</h1>
            <p class="profile-bio">{ FULL STACK DEVELOPER | OPEN SOURCE ENTHUSIAST }</p>
            
            <div class="social-section">
                <div class="social-links">
                    <a href="https://github.com/nopparat231" class="social-link" target="_blank" title="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="#" class="social-link" target="_blank" title="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="#" class="social-link" target="_blank" title="Twitter">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="mailto:your.email@example.com" class="social-link" target="_blank" title="Email">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <a href="#" class="social-link" target="_blank" title="Portfolio">
                        <i class="fas fa-globe"></i>
                    </a>
                </div>
            </div>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <i class="fas fa-history stat-icon"></i>
                <div class="stat-label">Recent Activities</div>
                <div class="recent-activity">
                    <div class="activity-item">
                        <i class="fas fa-code-branch activity-icon"></i>
                        <div class="activity-content">
                            <img src="https://github-readme-activity-graph.vercel.app/graph?username=nopparat231&theme=react-dark&hide_border=true&area=true&custom_title=Contribution%20Graph" alt="Contribution Graph" style="width: 100%; border-radius: 8px;">
                        </div>
                    </div>
                    <div class="activity-item">
                        <i class="fas fa-star activity-icon"></i>
                        <div class="activity-content">
                            <img src="https://github-profile-trophy.vercel.app/?username=nopparat231&theme=darkhub&no-frame=true&row=1&column=6" alt="GitHub Trophies" style="width: 100%; border-radius: 8px;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="stat-card">
                <i class="fas fa-star stat-icon"></i>
                <div class="stat-number">
                    <img src="https://github-readme-stats.vercel.app/api?username=nopparat231&show_icons=true&theme=radical&title_color=00ffff&text_color=ffffff&icon_color=00ffff&bg_color=0a0a0a&border_color=00ffff&hide_border=true&card_width=100" alt="GitHub Stats" style="width: 100%;">
                </div>
                <div class="stat-label">GitHub Stats</div>
            </div>

            <div class="stat-card">
                <i class="fas fa-laptop-code stat-icon"></i>
                <div class="stat-number">
                    <img src="https://github-readme-streak-stats.herokuapp.com/?user=nopparat231&theme=dark&background=0a0a0a&border=00ffff&stroke=00ffff&ring=00ffff&fire=ff00ff&currStreakLabel=00ffff&hide_border=true&card_width=100" alt="GitHub Streak" style="width: 100%;">
                </div>
                <div class="stat-label">Contribution Streak</div>
            </div>

            <div class="stat-card">
                <i class="fas fa-code stat-icon"></i>
                <div class="stat-number">
                    <img src="https://github-readme-stats.vercel.app/api/top-langs/?username=nopparat231&layout=compact&theme=radical&title_color=00ffff&text_color=ffffff&bg_color=0a0a0a&border_color=00ffff&hide_border=true&card_width=100" alt="Top Languages" style="width: 100%;">
                </div>
                <div class="stat-label">Most Used Languages</div>
            </div>
        </div>
    </div>
</body>
</html>
